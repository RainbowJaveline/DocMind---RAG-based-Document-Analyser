spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5434}/${DB_NAME:docmind}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  ai:
    # Select Google GenAI for both operations
    model:
      chat: google-genai
      embedding:
        text: google-genai
    google:
      genai:
        api-key: ${GOOGLE_API_KEY}
        project-id: ${GOOGLE_CLOUD_PROJECT_ID}
        chat:
          model: ${GOOGLE_CHAT_MODEL:gemini-2.5-flash}
          temperature: 0.2
        embedding:
          api-key: ${GOOGLE_API_KEY}
          project-id: ${GOOGLE_CLOUD_PROJECT_ID}
          text:
            model: ${GOOGLE_EMBEDDING_MODEL:gemini-embedding-001}
            dimensions: 768

    vectorstore:
      pgvector:
        index-type: hnsw
        distance-type: COSINE_DISTANCE
        dimensions: 768
        table-name: vector_store_gemini
        schema-name: public
        initialize-schema: true

  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 50MB

app:
  rag:
    chunk-size: 600
    chunk-overlap: 100
    top-k: 5
    similarity-threshold: 0.0

  cors:
    allowed-origins: "*"
    allowed-methods: "GET,POST,PUT,DELETE"
    allowed-headers: "*"